<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanksinsomnia</title>
    <link rel="stylesheet" href="UTSFavian.css">
</head>
<body>
<div class="container">
    <div class="kiri">
        <div class="logo">THANKSINSOMNIA</div>
        <br><br>
        <p class="tagline">A LITTLE SPACE TO UNWIND</p>
        <h1>Make room for a better night.</h1>
        <p>
            Thanksinsomnia adalah brand fashion lokal
            Indonesia yang memiliki gaya kasual dan
            cocok untuk anak muda.
        </p>
        <p>Stay up, keep dreaming!</p>
    </div>
    <div class="kanan">
        <h2>Welcome Back!</h2>
        <p>Silakan masuk ke akun kamu.</p>
        <form>
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Masukkan email"
                required
            >
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                required
            >
            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
            </div>
            <button type="submit">Sign In</button>
        </form>
        <p class="daftar">
            Belum punya akun?
            <a href="#">Daftar di sini</a>
        </p>
    </div>
</div>
</body>
</html>
